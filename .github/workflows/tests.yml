name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --junitxml=pytest-results.xml -o junit_family=legacy

      - name: Preserve test results and isolated runner measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml

      - name: Populated Coinbase book ingestion gate
        if: matrix.python-version == '3.11'
        run: >-
          python benchmarks/benchmark_prospective_source_bridge.py
          --populated-books --book-intervals 1,default
          --require-book-capacity > populated-book-benchmark.json

      - name: Preserve populated-book measurements
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: populated-book-benchmark
          path: populated-book-benchmark.json
