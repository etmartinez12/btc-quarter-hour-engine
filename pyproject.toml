[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-quarter-hour-engine"
version = "0.1.0"
description = "Leakage-safe Bitcoin quarter-hour prediction baseline engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "etmartinez12" }
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
  "httpx>=0.27,<1",
  "pyarrow>=16.0,<18",
  "websockets>=13.0,<16.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
btc-qh-baseline = "btc_quarter_hour_engine.run_baseline:main"
btc-qh-fetch-coinbase-candles = "btc_quarter_hour_engine.acquisition.cli:fetch_candles_main"
btc-qh-snapshot-coinbase-book = "btc_quarter_hour_engine.acquisition.cli:snapshot_book_main"
btc-qh-collect-coinbase-bbo = "btc_quarter_hour_engine.acquisition.cli:collect_coinbase_bbo_main"
btc-qh-build-forward-research-dataset = "btc_quarter_hour_engine.research.cli:main"
# Deprecated alias retained for backward compatibility; prefer btc-qh-collect-coinbase-bbo.
btc-qh-run-coinbase-websocket-collector = "btc_quarter_hour_engine.acquisition.cli:run_websocket_collector_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["btc_quarter_hour_engine*"]

[tool.setuptools.package-data]
btc_quarter_hour_engine = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
